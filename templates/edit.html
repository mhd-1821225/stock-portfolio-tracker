<!DOCTYPE html>
<html>
<head>
    <title>Edit your portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container container-sm">
        <h1>Edit your portfolio</h1>
        <p>Update purchase pricing or quantity for existing holdings.</p>

        {% if message %}
            <div class="alert-message">{{ message }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="ticker">Ticker:</label>
                <input type="text" id="ticker" name="ticker" required>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity" required>
            </div>

            <div class="form-group">
                <label for="purchase_price">Purchase Price:</label>
                <input type="number" step="0.01" id="purchase_price" name="purchase_price" required>
            </div>

            <button type="submit">EDIT STOCK</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="/main"><button type="button" class="btn-secondary">Back to Home</button></a>
        </div>
    </div>
</body>
</html>
